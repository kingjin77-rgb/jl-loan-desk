<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JL 대출데스크 테스트</title>
<style>
  body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
       max-width:1000px;margin:0 auto;padding:32px 24px;color:#111417;font-size:14px;line-height:1.6;}
  h1{font-size:20px;margin-bottom:4px;}
  p.lead{color:#4B5563;margin-bottom:20px;}
  #summary{font-weight:800;font-size:16px;padding:10px 14px;border-radius:8px;margin-bottom:16px;background:#F2F2F2;}
  #summary.pass{background:#E7F4ED;color:#1B7F4B;}
  #summary.fail{background:#FCECEA;color:#B3261E;}
  table{width:100%;border-collapse:collapse;}
  th{text-align:left;padding:8px;border-bottom:1px solid #D9D9D9;color:#4B5563;font-size:12.5px;}
  td{padding:6px 8px;border-bottom:1px solid #EEE;vertical-align:top;}
  td.mark{width:48px;font-weight:700;white-space:nowrap;}
  tr.pass td.mark{color:#1B7F4B;}
  tr.fail td.mark{color:#B3261E;}
  tr.fail{background:#FDF6F5;}
  code{font-size:12px;color:#B3261E;white-space:pre-wrap;}
</style>
</head>
<body>

<h1>JL 대출데스크 — 계산 엔진 테스트</h1>
<p class="lead">
  계산 엔진이 정상 동작하는지 확인합니다. 개발 도구를 설치하지 않아도 이 주소만 열면 됩니다.<br>
  실패한 항목이 있으면 그 내용을 그대로 개발 담당자에게 전달해 주십시오.
  <br><span style="color:#8A9199">이 테스트는 <code style="color:#8A9199">test/fixtures</code>의 고정 가상값으로 돌기 때문에,
  실제 규제 수치를 갱신해도 결과가 바뀌지 않습니다.
  데이터 파일 검사는 파일시스템이 필요해 여기서는 빠집니다(개발자가 <code style="color:#8A9199">node --test</code> 로 돌립니다).</span>
</p>

<div id="summary">실행 중…</div>

<table>
  <thead><tr><th>결과</th><th>항목</th><th>실패 내용</th></tr></thead>
  <tbody id="results"></tbody>
</table>

<script type="module">
  // node --test 와 **같은 파일**을 돌립니다. 새 테스트 파일을 만들면 여기에도 넣으십시오 —
  // 빠지면 사무실 PC에서 "전부 통과"로 보이는데 실제로는 그 검사를 안 한 것입니다.
  import './amortize.test.js';
  import './limit.test.js';
  import './timeline.test.js';
  import './hangul.test.js';
  import './eligibility.test.js';
  import './products.test.js';
  import './complex-builder.test.js';
  import './manwon.test.js';
  import './bunyangjeonhwan.test.js';
  import './rate-cap.test.js';
  import './selected-product.test.js';
  // data-integrity.test.js 는 data/ 폴더를 파일시스템으로 읽으므로 node 에서만 돕니다.
  // 브라우저에서는 그 검사가 빠지고, 그만큼 항목 수가 적게 나옵니다.
</script>
</body>
</html>
