# 빌드 과정이 없는 정적 사이트다. Netlify가 저장소를 그대로 서빙하면 된다.
[build]
  publish = "."
  command = ""

# 소스맵이나 설정 파일이 아니라, 앱이 fetch 하는 JSON 들이므로 그대로 서빙되어야 한다.
[[headers]]
  for = "/data/*"
  [headers.values]
    Content-Type = "application/json; charset=utf-8"

# 상담 도구는 검색에 잡힐 이유가 없다.
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
