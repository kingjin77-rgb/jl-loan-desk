  <div style="padding:32px;max-width:640px;margin:0 auto">
    <h1>자바스크립트가 꺼져 있습니다</h1>

</noscript>

<script type="module" src="src/main.js"></script>
<script>
  // 서비스 워커 — 홈 화면 설치와 오프라인 계산을 위해. http(s) 에서만 동작한다.
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register(new URL('sw.js', location.href)).catch(() => {
        // 등록에 실패해도 앱은 그대로 동작한다. 조용히 넘어간다.
      });
    });
  }
</script>
